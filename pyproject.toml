[project]
name = "my-invest"
version = "0.1.0"
description = "Indian Bank FD & Mutual Fund Investment Research and Portfolio Advisor"
readme = "README.md"
authors = [
    { name = "Nitin Tiwari", email = "nitin.iats@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "agno>=3.0.10",
    "ddgs>=9.16.0",
    "dotenv>=0.9.9",
    "groq<1.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "streamlit>=1.40.0",
    "yfinance>=1.7.0",
    "pandas>=2.0.0",
    "qdrant-client>=1.19.0",
    "fastembed>=0.9.0",
    "openai>=1.40.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
